<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artichoke Chat</title>
    <script src="/socket.io/socket.io.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@3.0.0/dist/index.min.js"
      integrity="sha384-hfwx2kzKy5NxBgMRht8rriI7XgcGwhBkC4/x5+dR24sye2FEiTnr+tHM6ttOXznr"
      crossorigin="anonymous"
      defer></script>
    <script src="js/index.js" defer></script>
    <script src="js/chat.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.8.0/css/bulma.min.css"
      integrity="sha384-5kGFOAqgEKnuF6c2jk2JANKHZgYVt38Wn2dVJENtq1EBCP54/1uzXU5mpxqL8WjN"
      crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" type="image/x-icon" href="images/artichoke.ico">
  </head>
  <body>
    <header>
      <nav class="navbar is-success" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
          <img id="logo-img" src="images/artichoke-logo.png" alt="Artichoke logo" width="110" height="110">
          <h1 class="navbar-item" id="h1-title">Artichoke Chat</h1>
          <button class="navbar-burger burger" aria-label="menu" aria-expanded="false" data-target="navbarBasicExample">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </button>
        </div>
        <div id="navbarBasicExample" class="navbar-menu">
          <div class="navbar-end">
            <div class="navbar-item">
              <div class="buttons">
                <p id="sound-p" aria-label="Sound">♫</p>
                <div class="onoffswitch" id="onoffswitch">
                  <input type="checkbox" name="onoffswitch" class="onoffswitch-checkbox" id="sound-control" checked>
                  <label class="onoffswitch-label" for="sound-control">
                    <span class="onoffswitch-inner"></span>
                    <span class="onoffswitch-switch"></span>
                  </label>
                </div>
                <button class="button" id="theme-button" type="button">🌗 Theme</button>
                <a
                  id="gh-button"
                  class="button"
                  href="https://github.com/pfeworkie-cmyk/chat_app"
                  target="_blank"
                  rel="noopener noreferrer">
                  <span class="icon" aria-hidden="true">GH</span>
                  <span><strong>Mon Code Source DevSecOps</strong></span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section id="login-page" class="section">
        <div id="login-form" class="container">
          <h2 class="title" id="login-label">Enter your name</h2>
          <div class="control has-icons-left">
            <input
              type="text"
              id="username-input"
              placeholder="Username"
              class="input is-success is-medium is-fullwidth"
              name="username"
              autofocus
              maxlength="20"
              autocomplete="nickname">
            <span class="icon is-left" aria-hidden="true">♙</span>
            <span id="username-error" role="status" aria-live="polite"></span>
          </div>
          <button class="button is-success is-medium is-fullwidth" id="send-username" type="button">Login</button>
        </div>
      </section>
      <section id="chat" hidden>
        <div id="chat-window">
          <span class="tag is-success is-light" id="users-counter">Online: 0</span>
          <div id="you-joined"></div>
          <div id="display-message" aria-live="polite"></div>
          <div id="typing-label" aria-live="polite"></div>
        </div>
        <span id="message-error" role="status" aria-live="polite"></span>
        <div class="control has-icons-left">
          <div id="message-box">
            <input id="message-input" class="input is-success" type="text" placeholder="Message" name="message" autocomplete="off">
            <span class="icon is-small is-left" aria-hidden="true">✉</span>
            <button class="button is-normal is-success is-light" id="emoji-button" type="button" aria-label="Choose an emoji">😃</button>
          </div>
        </div>
        <button id="send-message" class="button is-success is-fullwidth is-normal" type="button">Send</button>
      </section>
      <audio id="notification-sound" src="effect.mp3" preload="none"></audio>
    </main>
  </body>
</html>
